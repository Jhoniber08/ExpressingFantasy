# Compila Expressing Fantasy para Android con Godot (sin computadora: todo en GitHub)
name: Compilar APK Expressing Fantasy

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Descargar Godot y plantillas de exportación
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q -j Godot_v${GODOT_VERSION}-stable_export_templates.tpz 'templates/android_*' 'templates/version.txt' -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          ls ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Configurar SDK de Android para Godot
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOT
          cat ~/.config/godot/editor_settings-4.7.tres

      - name: Importar proyecto
        run: ./godot --headless --path . --import || true

      - name: Exportar APK firmado
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/expressingfantasy.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: expressingfantasy
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ExpressingFantasy2026
        run: |
          mkdir -p build
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg
          ./godot --headless --path . --export-release "Android" build/ExpressingFantasy.apk
          ls -la build

      - name: Subir APK (artefacto)
        uses: actions/upload-artifact@v4
        with:
          name: ExpressingFantasy-APK
          path: build/ExpressingFantasy.apk

      - name: Publicar en Releases (enlace de descarga directo)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Expressing Fantasy Remastered v0.1.${{ github.run_number }}
          make_latest: true
          files: build/ExpressingFantasy.apk
          body: |
            Expressing Fantasy · Remastered (Godot 4.7)
            Juego de mundo abierto sin conexión. Android 7.0 o superior.
            Creado por Jhoniber De la Cruz y Justin Manuel Nolasco «Mano».
